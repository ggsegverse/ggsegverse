url: https://ggsegverse.github.io/ggsegverse/
template:
  bootstrap: 5

reference:
  - title: Core packages
    contents:
      - ggsegverse_packages
      - ggsegverse_conflicts
  - title: Atlases
    desc: Find and install atlas packages from the ggsegverse r-universe.
    contents:
      - matches("ggseg_atlas")
  - title: Versions and updates
    contents:
      - ggsegverse_sitrep
      - ggsegverse_deps
      - ggsegverse_update
