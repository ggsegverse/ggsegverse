on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

name: pr-risk-tier.yaml

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-risk-tier:
    uses: ggsegverse/.github/.github/workflows/pr-risk-tier.yaml@main
    secrets: inherit
    with:
      # The meta-package's attach and conflict surface. Everything a user gets from library(ggsegverse) is decided here, so a change reaches every consumer at once.
      extra-t2-paths: |
        R/attach.R R/atlases.R R/conflicts.R
