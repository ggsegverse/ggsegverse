on:
  push:
    branches: [main, master]
    paths:
      - DESCRIPTION
      - .github/workflows/update-codemeta.yaml
  workflow_dispatch:

name: update-codemeta

permissions:
  contents: write
  pull-requests: write

jobs:
  update-codemeta:
    uses: ggsegverse/.github/.github/workflows/update-codemeta.yaml@main
    with:
      extra-repositories: https://ggsegverse.r-universe.dev
    secrets: inherit
    with:
      # write_codemeta() only reads DESCRIPTION + man/, so there is no need to
      # build+install the package.
      extra-packages: any::codemetar
